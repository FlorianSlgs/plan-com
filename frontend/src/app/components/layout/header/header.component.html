<header class="flex items-center justify-between px-6 py-4">
  <!-- Sélecteur de campagne -->
  <app-campaign-selector
    [campaigns]="campaigns()"
    [currentCampaign]="currentCampaign()"
    [loadingState]="loadingState()"
    [error]="error()"
    [successMessage]="successMessage()"
    (campaignSelected)="onCampaignSelected($event)"
    (openCampaignModal)="onOpenCampaignModal()"
  />
  
  <!-- Menu utilisateur avec indicateur d'invitations -->
  <app-user-menu
    [userFullName]="userFullName()"
    [pendingInvitationsCount]="pendingInvitations().length"
    (openSettings)="onOpenSettingsModal()"
    (logout)="onLogout()"
  />
</header>

<!-- Modal de création de campagne -->
<app-campaign-modal
  [isOpen]="showCampaignModal()"
  [loadingState]="loadingState()"
  [error]="error()"
  (close)="onCloseCampaignModal()"
  (createCampaign)="onCreateCampaign($event)"
/>

<!-- Modal des paramètres -->
<app-settings-modal
  [isOpen]="showSettingsModal()"
  [campaigns]="campaigns()"
  [currentCampaign]="currentCampaign()"
  [userFullName]="userFullName()"
  [loadingState]="loadingState()"
  [error]="error()"
  [successMessage]="successMessage()"
  [canDeleteCampaign]="canDeleteCampaignFn"
  [pendingInvitations]="pendingInvitations()"
  (close)="onCloseSettingsModal()"
  (deleteAccount)="onConfirmDeleteAccount()"
  (deleteCampaign)="onDeleteCampaign($event)"
  (inviteUser)="onInviteUser($event)"
  (acceptInvitation)="onAcceptInvitation($event)"
  (rejectInvitation)="onRejectInvitation($event)"
/>

<!-- Modal de confirmation de suppression (unique) -->
<app-delete-confirmation-modal
  [isOpen]="showDeleteConfirmModal() || showDeleteCampaignModal()"
  [loadingState]="loadingState()"
  [title]="getDeleteModalTitle()"
  [message]="getDeleteModalMessage()"
  [confirmButtonText]="'Supprimer'"
  [confirmButtonClass]="'bg-red-600 hover:bg-red-700'"
  [showWarningIcon]="true"
  (close)="onCloseDeleteModal()"
  (confirm)="onConfirmDelete()">
/>
