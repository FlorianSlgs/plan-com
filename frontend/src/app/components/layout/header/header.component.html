<header class="flex items-center justify-between px-6 py-4 bg-white shadow-md">
  <div class="flex items-center gap-4">
    <span class="text-xl font-bold text-gray-800">{{ currentCampaign || "Créez ou choisissez une campagne" }}</span>
    <div class="relative group" tabindex="0">
      <button class="flex items-center px-2 py-1 rounded hover:bg-gray-100 focus:outline-none">
        <span class="material-icons">expand_more</span>
      </button>
      <ul class="absolute left-0 mt-2 w-40 bg-white border border-gray-200 rounded shadow-lg opacity-0 group-focus-within:opacity-100 group-hover:opacity-100 pointer-events-none group-focus-within:pointer-events-auto group-hover:pointer-events-auto transition-opacity z-10">
      @for (campaign of campaigns; track campaign.id) {
        <li>
          <a href="#" class="block px-4 py-2 hover:bg-gray-100"
            (click)="selectCampaign(campaign.name); $event.preventDefault()">
            {{ campaign.name }}
          </a>        
        </li>
      }
      <li>
        <button
          class="block w-full text-left px-4 py-2 hover:bg-blue-100 text-blue-700 font-semibold"
          (click)="showCampaignModal = true"
          type="button"
        >
          Nouvelle campagne
        </button>
      </li>
    </ul>
    </div>
  </div>
  <div class="flex items-center gap-3">
    <img class="w-10 h-10 rounded-full object-cover border border-gray-300" src="assets/images/avatar.jpg" alt="Photo de l'utilisateur" />
    <span class="text-gray-700 font-medium">{{ userFullName }}</span>
    <button class="ml-2 text-gray-500 hover:text-red-600 transition" title="Déconnexion" (click)="onLogout()">
      <span class="material-icons text-2xl">logout</span>
    </button>
  </div>
</header>

<!-- Popup formulaire campagne -->
@if (showCampaignModal) {
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-40">
    <div class="bg-white rounded-lg shadow-lg p-8 w-full max-w-md relative">
      <button
        class="absolute top-2 right-2 text-gray-400 hover:text-red-500 text-2xl"
        (click)="showCampaignModal = false"
        title="Fermer"
        type="button"
      >&times;</button>
      <h2 class="text-lg font-bold mb-4 text-blue-700">Nouvelle campagne</h2>
      <form (ngSubmit)="createCampaign()" class="space-y-4">
        <div>
          <label class="block mb-1 font-medium">Nom de la campagne :</label>
          <input
            type="text"
            [(ngModel)]="campaignName"
            name="campaignName"
            required
            class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>
        <button
          type="submit"
          class="w-full bg-blue-600 text-white font-semibold py-2 rounded hover:bg-blue-700 transition"
        >
          Créer
        </button>
      </form>
    </div>
  </div>
}
