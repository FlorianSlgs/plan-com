@if (isOpen()) {
  <div 
    class="modal-overlay fixed inset-0 z-60 flex items-center justify-center backdrop-blur-sm bg-black/50"
    role="dialog"
    aria-modal="true"
    aria-labelledby="delete-confirm-title"
    (click)="onBackdropClick($event)"
    (keydown)="onKeydown($event)"
    tabindex="-1">
    
    <div class="modal-content bg-white rounded-lg shadow-xl p-6 w-full max-w-md relative animate-modal-in"
         cdkTrapFocus
         [cdkTrapFocusAutoCapture]="true"
         (click)="$event.stopPropagation()">
      <div class="modal-body text-center">
        <!-- Icône d'avertissement -->
        @if (showWarningIcon()) {
          <div class="warning-icon mx-auto flex items-center justify-center h-16 w-16 rounded-full bg-red-100 mb-6">
            <span class="material-icons text-red-600 text-3xl">warning</span>
          </div>
        }
        
        <!-- Titre -->
        <h3 id="delete-confirm-title" class="text-xl font-bold text-gray-900 mb-4">
          {{ title() }}
        </h3>
        
        <!-- Message de confirmation -->
        <div class="confirmation-message text-sm text-gray-600 mb-6 leading-relaxed" 
             [innerHTML]="message()">
        </div>
        
        <!-- Boutons d'action -->
        <div class="modal-actions flex gap-3 justify-center">
          <button
            type="button"
            (click)="onClose()"
            [disabled]="loadingState() === 'loading'"
            #cancelButton
            class="cancel-btn flex-1 max-w-32 bg-gray-200 text-gray-800 font-medium py-3 px-4 rounded-lg hover:bg-gray-300 transition-colors duration-200 disabled:opacity-50 disabled:cursor-not-allowed">
            {{ cancelButtonText() }}
          </button>
          
          <button
            type="button"
            (click)="onConfirm()"
            [disabled]="loadingState() === 'loading'"
            class="confirm-btn flex-1 max-w-32 text-white font-medium py-3 px-4 rounded-lg transition-colors duration-200 disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center"
            [class]="confirmButtonClass()">
            @if (loadingState() === 'loading') {
              <div class="loading-spinner w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin mr-2"></div>
              {{ loadingText() }}
            } @else {
              <span class="material-icons mr-2 text-lg">delete</span>
              {{ confirmButtonText() }}
            }
          </button>
        </div>
      </div>
    </div>
  </div>
}
