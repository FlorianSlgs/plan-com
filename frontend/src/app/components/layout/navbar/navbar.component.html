<nav class="bg-gray-300">
  <!-- Bouton hamburger (visible uniquement sur mobile/tablette) -->
  <button 
    class="lg:hidden fixed top-4 left-4 z-20 p-2 bg-white rounded-lg shadow-md border border-gray-200 hover:bg-gray-50 transition-colors"
    (click)="toggleMobileMenu()"
    [attr.aria-expanded]="isMobileMenuOpen"
    aria-label="Toggle navigation menu">
    <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        stroke-width="2" 
        [attr.d]="isMobileMenuOpen ? 'M6 18L18 6M6 6l12 12' : 'M4 6h16M4 12h16M4 18h16'">
      </path>
    </svg>
  </button>

  <!-- Overlay pour fermer le menu mobile -->
  <div 
    class="lg:hidden fixed inset-0 backdrop-blur-sm bg-white/30 transition-opacity z-10"
    [class.opacity-0]="!isMobileMenuOpen"
    [class.pointer-events-none]="!isMobileMenuOpen"
    [class.opacity-100]="isMobileMenuOpen"
    (click)="closeMobileMenu()">
  </div>

  <!-- Sidebar Navigation -->
  <div 
    class="bg-gray-100 shadow-md h-[calc(100vh-1rem)] w-58 flex flex-col px-6 py-8 fixed left-2 top-2 rounded-xl border border-gray-200 transition-transform duration-300 ease-in-out"
    [class]="getNavbarClasses()"
    style="z-index: 11;"
     aria-label="Menu principal" role="navigation">
    
    <!-- Header avec bouton fermer sur mobile -->
    <div class="flex items-center justify-between mb-10">
      <h1>
        <a class="text-xl font-medium ml-10 lg:ml-2"  routerLink="/accueil">PLAN DE COM'</a>
      </h1>
    </div>

    <!-- Navigation principale -->
    <ul class="flex flex-col gap-4 mb-8">
      <li>
        <a routerLink="/home/recap" 
          routerLinkActive="!text-black before:opacity-100"
          [class]="hasCampaign ? 'relative text-gray-500 px-4 py-2 rounded transition flex items-center gap-2 before:content-[\'\'] before:absolute before:inset-0 before:bg-white before:rounded-lg before:opacity-0 hover:before:opacity-100 before:transition-opacity before:-z-10 hover:text-black' : 'relative text-gray-300 px-4 py-2 rounded flex items-center gap-2 cursor-not-allowed pointer-events-none'"
          (click)="preventNavigation($event); closeMobileMenuOnNavigation()">
          
          <svg class="w-5 h-5 relative z-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                  d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
          </svg>
          
          <span class="relative z-10 whitespace-nowrap">Tableau de bord</span>
        </a>
      </li>
      <li>
        <a routerLink="/home/goals" 
          routerLinkActive="!text-black before:opacity-100"
          [class]="hasCampaign ? 'relative text-gray-500 px-4 py-2 rounded transition flex items-center gap-2 before:content-[\'\'] before:absolute before:inset-0 before:bg-white before:rounded-lg before:opacity-0 hover:before:opacity-100 before:transition-opacity before:-z-10 hover:text-black' : 'relative text-gray-300 text-sm px-4 py-2 rounded flex items-center gap-2 cursor-not-allowed pointer-events-none'"
          (click)="preventNavigation($event); closeMobileMenuOnNavigation()">
          
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={1.5} stroke="currentColor" class="w-5 h-5 relative z-10">
            <path strokeLinecap="round" strokeLinejoin="round" d="M15.59 14.37a6 6 0 0 1-5.84 7.38v-4.8m5.84-2.58a14.98 14.98 0 0 0 6.16-12.12A14.98 14.98 0 0 0 9.631 8.41m5.96 5.96a14.926 14.926 0 0 1-5.841 2.58m-.119-8.54a6 6 0 0 0-7.381 5.84h4.8m2.581-5.84a14.927 14.927 0 0 0-2.58 5.84m2.699 2.7c-.103.021-.207.041-.311.06a15.09 15.09 0 0 1-2.448-2.448 14.9 14.9 0 0 1 .06-.312m-2.24 2.39a4.493 4.493 0 0 0-1.757 4.306 4.493 4.493 0 0 0 4.306-1.758M16.5 9a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0Z" />
          </svg>
          
          <span class="relative z-10">Objectifs</span>
        </a>
      </li>
      <li>
        <a routerLink="/home/targets" 
          routerLinkActive="!text-black before:opacity-100"
          [class]="hasCampaign ? 'relative text-gray-500 px-4 py-2 rounded transition flex items-center gap-2 before:content-[\'\'] before:absolute before:inset-0 before:bg-white before:rounded-lg before:opacity-0 hover:before:opacity-100 before:transition-opacity before:-z-10 hover:text-black' : 'relative text-gray-300 px-4 py-2 rounded flex items-center gap-2 cursor-not-allowed pointer-events-none'"
          (click)="preventNavigation($event); closeMobileMenuOnNavigation()">
          
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 0 0 2.625.372 9.337 9.337 0 0 0 4.121-.952 4.125 4.125 0 0 0-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 0 1 8.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0 1 11.964-3.07M12 6.375a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0Zm8.25 2.25a2.625 2.625 0 1 1-5.25 0 2.625 2.625 0 0 1 5.25 0Z" />
          </svg>
          
          <span class="relative z-10">Cibles</span>
        </a>
      </li>
      <li>
        <a routerLink="/home/actions" 
          routerLinkActive="!text-black before:opacity-100"
          [class]="hasCampaign ? 'relative text-gray-500 px-4 py-2 rounded transition flex items-center gap-2 before:content-[\'\'] before:absolute before:inset-0 before:bg-white before:rounded-lg before:opacity-0 hover:before:opacity-100 before:transition-opacity before:-z-10 hover:text-black' : 'relative text-gray-300 px-4 py-2 rounded flex items-center gap-2 cursor-not-allowed pointer-events-none'"
          (click)="preventNavigation($event); closeMobileMenuOnNavigation()">
          
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5m-9-6h.008v.008H12v-.008ZM12 15h.008v.008H12V15Zm0 2.25h.008v.008H12v-.008ZM9.75 15h.008v.008H9.75V15Zm0 2.25h.008v.008H9.75v-.008ZM7.5 15h.008v.008H7.5V15Zm0 2.25h.008v.008H7.5v-.008Zm6.75-4.5h.008v.008h-.008v-.008Zm0 2.25h.008v.008h-.008V15Zm0 2.25h.008v.008h-.008v-.008Zm2.25-4.5h.008v.008H16.5v-.008Zm0 2.25h.008v.008H16.5V15Z" />
          </svg>

          <span class="relative z-10">Actions</span>
        </a>
      </li>
      <li>
        <a routerLink="/home/tasks" 
          routerLinkActive="!text-black before:opacity-100"
          [class]="hasCampaign ? 'relative text-gray-500 px-4 py-2 rounded transition flex items-center gap-2 before:content-[\'\'] before:absolute before:inset-0 before:bg-white before:rounded-lg before:opacity-0 hover:before:opacity-100 before:transition-opacity before:-z-10 hover:text-black' : 'relative text-gray-300 px-4 py-2 rounded flex items-center gap-2 cursor-not-allowed pointer-events-none'"
          (click)="preventNavigation($event); closeMobileMenuOnNavigation()">
          
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 0 0 2.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 0 0-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 0 0 .75-.75 2.25 2.25 0 0 0-.1-.664m-5.8 0A2.251 2.251 0 0 1 13.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25ZM6.75 12h.008v.008H6.75V12Zm0 3h.008v.008H6.75V15Zm0 3h.008v.008H6.75V18Z" />
          </svg>

          <span class="relative z-10">Tâches</span>
        </a>
      </li>
    </ul>

    <!-- Section utilisateur et actions -->
    <div class="md:hidden">

      <!-- Séparateur -->
      <div class="border-t border-gray-300 mb-6"></div>

      <div class="mt-auto">
        <!-- Informations utilisateur -->
        <div class="mb-6 px-4">
          <!-- Nom de l'utilisateur cliquable -->
          <button
            type="button"
            (click)="openProfileModal()"
            class="w-full text-center text-gray-700 font-medium mb-2 hover:text-blue-600 transition-colors cursor-pointer underline-offset-2 truncate"
            [title]="'Cliquez pour modifier votre profil - ' + userFullName()"
            [disabled]="loadingUserData()">
            {{ loadingUserData() ? 'Chargement...' : userFullName() }}
          </button>
        </div>

        <!-- Actions -->
        <ul class="flex flex-row gap-4 justify-center"> <!-- Changer flex-col en flex-row si souhaité -->
        <!-- Paramètres avec badge de notification -->
        <li>
          <button
            type="button"
            (click)="openSettingsModal()"
            class="relative text-gray-500 hover:text-black transition-colors p-1 rounded-full focus:outline-none"
            title="Ouvrir les paramètres">
            <div class="relative">
              <span class="material-icons text-lg">settings</span>
              @if (pendingInvitations().length > 0) {
                <div class="absolute -top-1 -right-1 bg-red-500 text-white text-xs font-bold rounded-full min-w-[16px] h-[16px] flex items-center justify-center border border-white shadow-md animate-pulse"
                    [title]="pendingInvitations().length + ' invitation(s) en attente'"
                    role="status"
                    [attr.aria-label]="pendingInvitations().length + ' invitations en attente'">
                  {{ pendingInvitations().length > 9 ? '9+' : pendingInvitations().length }}
                </div>
              }
            </div>
          </button>
        </li>
        <!-- Déconnexion -->
        <li>
          <button
            type="button"
            (click)="onLogout()"
            class="relative text-gray-500 hover:text-red-600 transition-colors p-1 rounded-full focus:outline-none"
            title="Se déconnecter">
            <span class="material-icons text-lg">logout</span>
          </button>
        </li>
      </ul>
      </div>
    </div>

  </div>
</nav>
