<div class="max-w-4xl mx-auto p-6">

  <!-- Message d'erreur -->
  @if (error(); as errorMsg) {
    <div class="mb-6 p-4 bg-red-100 border border-red-400 text-red-700 rounded-lg flex items-center justify-between" role="alert">
      <span>{{ errorMsg }}</span>
      <button 
        type="button" 
        (click)="clearError()" 
        class="ml-2 text-red-500 hover:text-red-700"
        aria-label="Fermer le message d'erreur"
      >
        ×
      </button>
    </div>
  }

  <!-- Contenu principal -->
  <main>
    <!-- Section du dernier objectif -->
    <section class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full">
      
      @if (loading()) {
        <!-- État de chargement -->
        <div class="bg-white rounded-xl shadow-md border border-gray-200 p-6">
          <div class="flex justify-center items-center py-8">
            <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
            <span class="ml-3 text-gray-600">Chargement du dernier objectif...</span>
          </div>
        </div>
      } @else if (hasLastGoal()) {
        <!-- Encadré du dernier objectif -->
        <button class="goal-card bg-white rounded-2xl shadow-md px-6 pt-8 pb-4 flex flex-col items-center text-center relative group" routerLink="/home/goals">
    
            <!-- SVG en haut à gauche -->
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={1.5} stroke="currentColor" class="absolute top-4 left-4 w-6 h-6">
                <path strokeLinecap="round" strokeLinejoin="round" d="M15.59 14.37a6 6 0 0 1-5.84 7.38v-4.8m5.84-2.58a14.98 14.98 0 0 0 6.16-12.12A14.98 14.98 0 0 0 9.631 8.41m5.96 5.96a14.926 14.926 0 0 1-5.841 2.58m-.119-8.54a6 6 0 0 0-7.381 5.84h4.8m2.581-5.84a14.927 14.927 0 0 0-2.58 5.84m2.699 2.7c-.103.021-.207.041-.311.06a15.09 15.09 0 0 1-2.448-2.448 14.9 14.9 0 0 1 .06-.312m-2.24 2.39a4.493 4.493 0 0 0-1.757 4.306 4.493 4.493 0 0 0 4.306-1.758M16.5 9a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0Z" />
            </svg>

            <h3 class="text-xl font-bold mb-3 text-gray-900">{{ lastGoal()!.title }}</h3>
            
            <!-- Image avec lazy loading et gestion d'erreur -->
            <img 
                [src]="lastGoal()!.imageUrl" 
                [alt]="'Image de l\'objectif: '" 
                class="w-24 h-24 object-cover rounded-full mb-4 border border-gray-200" 
                loading="lazy"
                onerror="this.src='data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTIwIiBoZWlnaHQ9IjEyMCIgdmlld0JveD0iMCAwIDEyMCAxMjAiIGZpbGw9Im5vbmUiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+CjxyZWN0IHdpZHRoPSIxMjAiIGhlaWdodD0iMTIwIiBmaWxsPSIjRjNGNEY2Ii8+CjxwYXRoIGQ9Ik0zNiA0OEw2MCA3Mkw4NCA0OFY4NEgzNlY0OFoiIGZpbGw9IiM5Q0E0QUYiLz4KPHR0ZXh0IHg9IjYwIiB5PSIxMDAiIGZvbnQtZmFtaWx5PSJBcmlhbCIgZm9udC1zaXplPSIxMCIgZmlsbD0iIzZCNzI4MCIgdGV4dC1hbmNob3I9Im1pZGRsZSI+SW1hZ2UgaW5kaXNwb25pYmxlPC90dGV4dD4KPC9zdmc+Cg=='"  
            />
            
            <p class="text-gray-700 mb-4">{{ lastGoal()!.description }}</p>
            
            <ul class="space-y-2 w-full list-none" role="list">
                @for (item of lastGoal()!.items; track item) {
                <li class="bg-gray-100 text-gray-800 px-3 py-1 rounded" role="listitem">{{ item }}</li>
                }
                @empty {
                <li class="text-gray-500 italic">Aucun sous-objectif défini</li>
                }
            </ul>
        </button>
      }
        
    </section>

  </main>
</div>
