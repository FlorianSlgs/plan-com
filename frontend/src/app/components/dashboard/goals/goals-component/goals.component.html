<div class="max-w-4xl mx-auto">
  <header class="mb-8">
    <div class="flex items-center justify-between gap-4">
      <h1 class="text-2xl font-bold text-blue-700">Objectifs</h1>
      <button
        class="w-10 h-10 flex items-center justify-center rounded-full bg-blue-600 text-white text-2xl hover:bg-blue-700 transition"
        (click)="openAddCardModal()"
        title="Ajouter un objectif"
        type="button"
      >+</button>
    </div>
    <span class="block h-px bg-gray-300 w-9/10 mt-2"></span>
  </header>

  <main>
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 w-full">
      @for (card of cards; track card.id) {
        <app-goals-cards
          [title]="card.title"
          [imageUrl]="card.imageUrl"
          [description]="card.description"
          [items]="card.items"
          (edit)="onEditCard($index)">
        </app-goals-cards>
      }
    </div>
  </main>
</div>

@if (showAddCardModal) {
  <div class="fixed inset-0 z-50 flex items-center justify-center backdrop-blur-sm bg-white/30">
    <div class="bg-white rounded-lg shadow-lg p-8 w-full max-w-md relative">
      <button
        class="absolute top-2 right-2 text-gray-400 hover:text-red-500 text-2xl"
        (click)="closeAddCardModal()"
        title="Fermer"
        type="button"
      >&times;</button>
      <h2 class="text-lg font-bold mb-4 text-blue-700">Ajouter un Objectif</h2>
      <form (ngSubmit)="addCard()" enctype="multipart/form-data" class="space-y-4">
        <div>
          <label class="block mb-1 font-medium">Titre :</label>
          <input type="text" [(ngModel)]="newTitle" name="title" required
            class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <div>
          <label class="block mb-1 font-medium">Image :</label>
          <label
            class="flex flex-col items-center justify-center w-full h-32 border-2 border-dashed border-blue-400 rounded cursor-pointer hover:border-blue-600 transition group"
            (dragover)="onDragOver($event)"
            (drop)="onDrop($event)"
          >
            <svg class="w-10 h-10 text-blue-400 group-hover:text-blue-600 mb-2" fill="none" stroke="currentColor" stroke-width="2"
              viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M3 16.5V19a2 2 0 002 2h14a2 2 0 002-2v-2.5M16 10V6a4 4 0 10-8 0v4M12 16v-4" />
            </svg>
            <span class="text-blue-500 group-hover:text-blue-700 font-medium" *ngIf="!imagePreview">Cliquez ou glissez une image ici</span>
            <input
              type="file"
              (change)="onFileSelected($event)"
              name="image"
              accept="image/*"
              class="hidden"
              required
            />
            <div *ngIf="imagePreview" class="mt-2 flex flex-col items-center">
              <img [src]="imagePreview" alt="Aperçu" class="max-h-24 rounded shadow mb-1" />
            </div>
          </label>
        </div>
        <div>
          <label class="block mb-1 font-medium">Description :</label>
          <textarea [(ngModel)]="newDescription" name="description"
            class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
        </div>
        <div>
          <label class="block mb-1 font-medium">Sous-objectifs (séparés par des virgules) :</label>
          <input type="text" [(ngModel)]="newItems" name="items"
            placeholder="Sous-objectif 1, Sous-objectif 2"
            class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 placeholder:text-gray-500" />
        </div>
        <button
          type="submit"
          class="w-full bg-blue-600 text-white font-semibold py-2 rounded hover:bg-blue-700 transition"
        >
          Ajouter
        </button>
      </form>
    </div>
  </div>
}

@if (editIndex !== null) {
  <div class="fixed inset-0 z-50 flex items-center justify-center backdrop-blur-sm bg-white/30">
    <div class="bg-white rounded-lg shadow-lg p-8 w-full max-w-md relative">
      <button
        class="absolute top-2 right-2 text-gray-400 hover:text-red-500 text-2xl"
        (click)="closeEditModal()"
        title="Fermer"
        type="button"
      >&times;</button>
      <h2 class="text-lg font-bold mb-4 text-blue-700">Modifier l'Objectif</h2>
      <form (ngSubmit)="updateCard()" enctype="multipart/form-data" class="space-y-4">
        <div>
          <label class="block mb-1 font-medium">Titre :</label>
          <input type="text" [(ngModel)]="editTitle" name="editTitle" required
            class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <div>
          <label class="block mb-1 font-medium">Image :</label>
          <label
            class="flex flex-col items-center justify-center w-full h-32 border-2 border-dashed border-blue-400 rounded cursor-pointer hover:border-blue-600 transition group"
            (dragover)="onDragOver($event)"
            (drop)="onEditDrop($event)"
          >
            <svg class="w-10 h-10 text-blue-400 group-hover:text-blue-600 mb-2" fill="none" stroke="currentColor" stroke-width="2"
              viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M3 16.5V19a2 2 0 002 2h14a2 2 0 002-2v-2.5M16 10V6a4 4 0 10-8 0v4M12 16v-4" />
            </svg>
            <span class="text-blue-500 group-hover:text-blue-700 font-medium" *ngIf="!editImagePreview">Cliquez ou glissez une image ici</span>
            <input
              type="file"
              (change)="onEditFileSelected($event)"
              name="editImage"
              accept="image/*"
              class="hidden"
            />
            <div *ngIf="editImagePreview" class="mt-2 flex flex-col items-center">
              <img [src]="editImagePreview" alt="Aperçu" class="max-h-24 rounded shadow mb-1" />
            </div>
          </label>
        </div>
        <div>
          <label class="block mb-1 font-medium">Description :</label>
          <textarea [(ngModel)]="editDescription" name="editDescription"
            class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
        </div>
        <div>
          <label class="block mb-1 font-medium">Sous-objectifs (séparés par des virgules) :</label>
          <input type="text" [(ngModel)]="editItems" name="editItems"
            placeholder="Sous-objectif 1, Sous-objectif 2"
            class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 placeholder:text-gray-500" />
        </div>
        <button
          type="submit"
          class="w-full bg-blue-600 text-white font-semibold py-2 rounded hover:bg-blue-700 transition"
        >
          Enregistrer les modifications
        </button>
      </form>
    </div>
  </div>
}
