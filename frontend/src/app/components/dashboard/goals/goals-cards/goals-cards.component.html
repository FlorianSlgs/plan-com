<div class="goal-card bg-white rounded-lg shadow-md p-6 flex flex-col items-center text-center">
  <h3 class="text-xl font-bold mb-3 text-blue-700">{{ title }}</h3>
  <img [src]="imageUrl" alt="Image objectif" class="w-24 h-24 object-cover rounded-full mb-4 border border-gray-200" />
  <p class="text-gray-700 mb-4">{{ description }}</p>
  <ul class="space-y-2 w-full">
    @for (item of items; track item) {
      <li class="bg-blue-50 text-blue-800 px-3 py-1 rounded">{{ item }}</li>
    }
  </ul>
</div>
