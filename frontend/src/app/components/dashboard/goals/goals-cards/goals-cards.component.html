<div class="goal-card bg-white rounded-2xl shadow-md p-6 flex flex-col items-center text-center relative group">
  
  <!-- Bouton modification en haut à droite (conditionnel) -->
  @if (canEdit()) {
    <button
      class="absolute top-3 right-3 bg-white/80 hover:bg-blue-100 rounded-full p-2 shadow transition opacity-0 group-hover:opacity-100"
      title="Modifier"
      type="button"
      (click)="onEditClick()"
      [attr.aria-label]="'Modifier l\'objectif ' + title()"
    >
      <!-- Icône crayon SVG -->
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10" />
      </svg>
    </button>
  }

  <h3 class="text-xl font-bold mb-3 text-gray-900">{{ title() }}</h3>
  
  <!-- Image avec lazy loading et gestion d'erreur -->
  <img 
    [src]="imageUrl()" 
    [alt]="'Image de l\'objectif: ' + title()" 
    class="w-24 h-24 object-cover rounded-full mb-4 border border-gray-200" 
    loading="lazy"
    onerror="this.src='https://via.placeholder.com/120x80?text=Image+non+disponible'"
  />
  
  <p class="text-gray-700 mb-4">{{ description() }}</p>
  
  <ul class="space-y-2 w-full list-none" role="list">
    @for (item of items(); track trackByItem($index, item)) {
      <li class="bg-gray-100 text-gray-800 px-3 py-1 rounded" role="listitem">{{ item }}</li>
    }
    @empty {
      <li class="text-gray-500 italic">Aucun sous-objectif défini</li>
    }
  </ul>
</div>
